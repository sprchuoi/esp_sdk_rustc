[workspace]
resolver = "3"
members = ["hal", "kernel"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sprchuoi/esp_sdk_rustc"
authors = ["sprchuoi"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = 2
overflow-checks = true
