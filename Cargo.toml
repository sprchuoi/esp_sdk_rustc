[workspace]
resolver = "3"
members = ["kernel"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sprchuoi/esp_sdk_rustc"
authors = ["sprchuoi"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
