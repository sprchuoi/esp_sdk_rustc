[package]
name = "esp-sdk-esp32s3"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
esp-hal = { version = "1.2.2", features = ["esp32s3", "unstable"] }
esp-sdk-hal = { path = "../../hal" }
esp-println = { version = "0.18.0", features = ["esp32s3"] }

[profile.release]
opt-level = "s"
lto = true

[features]
hardware-uart = []
