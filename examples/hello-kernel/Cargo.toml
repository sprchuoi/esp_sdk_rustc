[package]
name = "hello-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
esp-hal = { version = "1.2.2", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-sdk-kernel = { path = "../../kernel" }
esp-sdk-esp32s3 = { path = "../../soc/esp32s3" }

[profile.release]
opt-level = "s"
lto = true
debug = 2
