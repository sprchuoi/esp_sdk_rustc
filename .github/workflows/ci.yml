name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: ./esp_sdk.sh --fmt

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./esp_sdk.sh --lint

  test:
    name: host tests + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./esp_sdk.sh --test
      - run: ./esp_sdk.sh --docs

  msrv:
    name: MSRV 1.95
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  nostd:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - run: ./esp_sdk.sh --nostd

  # The device builds activate themselves as soon as the first SoC crate lands
  # (Phase 2). Until then they are green no-ops, not red failures.
  device-esp32s3:
    name: build ESP32-S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          if [ -f soc/esp32s3/Cargo.toml ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::soc/esp32s3 not present yet (Phase 2); device build skipped."
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: esp32s3
          default: true
          override: true
      - if: steps.gate.outputs.enabled == 'true'
        run: cargo build --release --target xtensa-esp32s3-none-elf --manifest-path soc/esp32s3/Cargo.toml

  device-esp32c6:
    name: build ESP32-C6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          if [ -f soc/esp32c6/Cargo.toml ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::soc/esp32c6 not present yet (Phase 2/8); build skipped."
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.gate.outputs.enabled == 'true'
        run: rustup target add riscv32imac-unknown-none-elf
      - if: steps.gate.outputs.enabled == 'true'
        run: cargo build --release --target riscv32imac-unknown-none-elf -p esp-sdk-esp32c6

  # Configuration matrix: defconfigs, allyesconfig, allnoconfig, strict binding.
  # Activates with the config generator (Phase 2).
  config-matrix:
    name: config matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          if [ -f tools/gen/Cargo.toml ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::config generator not present yet (Phase 2); matrix skipped."
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.gate.outputs.enabled == 'true'
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: esp32s3
          default: true
          override: true
      - if: steps.gate.outputs.enabled == 'true'
        run: cargo xtask ci --matrix all


  # Emulator smoke test: boots the hello-kernel example on a real mask ROM and
  # the ESP-IDF bootloader, then asserts the scheduler, IPC and diagnostics run.
  # Gated by the SIMULATION variable because it downloads the Xtensa toolchain
  # and builds the emulator (~10 min).
  simulation:
    name: esp32sim boot smoke
    if: ${{ vars.SIMULATION == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: esp32s3
          default: true
          override: true
      - uses: Swatinem/rust-cache@v2
      - run: ./esp_sdk.sh --sim --sim-b0

  # Hardware-in-the-loop. Enabled by setting the repository variable
  # HIL_RUNNER to a self-hosted runner label (Phase 3+, needs a board).
  hil:
    name: hardware-in-the-loop
    if: ${{ vars.HIL_RUNNER != '' }}
    runs-on: ${{ vars.HIL_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask hil
